name: Enforce Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to protect
        required: false
        default: main

jobs:
  protect:
    name: apply branch protection
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection rules
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # The default GITHUB_TOKEN has no "administration" scope; branch protection
          # requires a PAT (classic or fine-grained with Administration: write) stored
          # as the ADMIN_TOKEN repository secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the ADMIN_TOKEN repository secret to a token with 'Administration: write' access before running this workflow."
            exit 1
          fi

          # "evaluate" must match the job name of the required check
          # (see .github/workflows/evaluate-changed.yml).
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/branches/${BRANCH}/protection" \
            --input - <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["evaluate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          JSON

          echo "Branch protection applied to '${BRANCH}' on ${REPO}."
